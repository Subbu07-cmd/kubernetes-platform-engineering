{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ms.name" . }}
  labels: {{- include "ms.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "ms.selector" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        {{- range .Values.networkPolicy.allowFromNamespaces }}
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: {{ . }} }
        {{- end }}
        {{- range .Values.networkPolicy.allowFromApps }}
        - podSelector:
            matchLabels: { app.kubernetes.io/name: {{ . }} }
        {{- end }}
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: monitoring }
      ports:
        - port: {{ .Values.containerPort }}
{{- end }}
