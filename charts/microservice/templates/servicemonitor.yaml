{{- if and .Values.serviceMonitor.enabled (.Capabilities.APIVersions.Has "monitoring.coreos.com/v1") }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "ms.name" . }}
  labels: {{- include "ms.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels: {{- include "ms.selector" . | nindent 6 }}
  endpoints:
    - port: http
      path: {{ .Values.serviceMonitor.path }}
      interval: 30s
{{- end }}
