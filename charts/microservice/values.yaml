nameOverride: ""
image:
  repository: ""
  tag: ""
  pullPolicy: IfNotPresent

replicaCount: 2
containerPort: 8080

env: {}

resources:
  requests: { cpu: 100m, memory: 128Mi }
  limits: { memory: 256Mi }

probes:
  path: /health
  initialDelaySeconds: 5

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

pdb:
  enabled: true
  minAvailable: 1

serviceAccount:
  create: true
  annotations: {}   # e.g. eks.amazonaws.com/role-arn for IRSA

networkPolicy:
  enabled: true
  allowFromNamespaces: [ingress-nginx]
  allowFromApps: []

serviceMonitor:
  enabled: true
  path: /metrics
