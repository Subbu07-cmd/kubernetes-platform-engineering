apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: demo-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Subbu07-cmd/kubernetes-platform-engineering.git
    targetRevision: main
    path: charts/microservice
    helm:
      releaseName: demo-app
      valueFiles: [../../local/demo-values.yaml]
  destination:
    server: https://kubernetes.default.svc
    namespace: demo
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
