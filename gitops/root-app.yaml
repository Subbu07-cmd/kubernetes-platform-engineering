apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Subbu07-cmd/kubernetes-platform-engineering.git
    targetRevision: main
    path: gitops
    directory:
      recurse: true
      include: "{platform/*.yaml,apps/*/application.yaml}"
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated: { prune: true, selfHeal: true }
