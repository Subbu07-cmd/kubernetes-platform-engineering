image:
  repository: 123456789012.dkr.ecr.us-east-1.amazonaws.com/payments-api
  tag: "2.14.0"
resources:
  requests: { cpu: 250m, memory: 256Mi }
  limits: { memory: 512Mi }
autoscaling:
  minReplicas: 3
  maxReplicas: 20
pdb:
  minAvailable: 2
networkPolicy:
  allowFromNamespaces: [ingress-nginx]
  allowFromApps: [orders-api]
serviceAccount:
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/payments-api
